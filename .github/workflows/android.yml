name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Run project tests
        run: npm test
      - name: Prepare Capacitor
        run: |
          npm ci
          mkdir -p www
          cp index.html sw.js www/
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install stable app signing key
        run: |
          mkdir -p ~/.android
          cp android/app/radio-id-debug.keystore ~/.android/debug.keystore
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify installable APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1
          expected=$("$JAVA_HOME/bin/keytool" -list -v -keystore android/app/radio-id-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$expected" && test "$expected" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: radio-id-v3.5.7-clean-language-search-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
