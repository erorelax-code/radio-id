async function loadCountries(){try{const codes=await api('/countrycodes?hidebroken=true');const entries=codes.filter(c=>/^[A-Z]{2}$/.test(c.name)&&Number(c.stationcount)>0).map(c=>c.name);if(entries.length){catalogueCountries=entries;renderCountries()}}catch(e){}}
async function loadLanguages(){try{const languages=await api('/languages?hidebroken=true');const entries=languages.filter(x=>x.name&&Number(x.stationcount)>0).flatMap(x=>String(x.name).toLowerCase().split(/[,;/]/).map(name=>({name:name.trim(),iso_639:x.iso_639||''}))).filter(x=>x.name);if(entries.length){catalogueLanguages=[...new Map(entries.map(x=>[x.name,x])).values()];renderLanguages()}}catch(e){}}
async function load(){const run=++stationLoadRun;stations=mergeStations([]);status.textContent=t('updating');render();try{const params='?hidebroken=true&limit=150&order=clickcount&reverse=true';const path=selectedCountry&&selectedLanguage?'/stations/search?'+new URLSearchParams({countrycode:selectedCountry,language:selectedLanguage,hidebroken:'true',limit:'150',order:'clickcount',reverse:'true'}):selectedCountry?'/stations/bycountrycodeexact/'+encodeURIComponent(selectedCountry)+params:selectedLanguage?'/stations/bylanguageexact/'+encodeURIComponent(selectedLanguage)+params:'/stations/topclick/150';const found=norm(await api(path));if(run!==stationLoadRun)return;stations=mergeStations(found);status.textContent=stations.length+' '+t('stationCount');render()}catch(e){if(run!==stationLoadRun)return;status.textContent=stations.length?stations.length+' '+t('stationCount')+' · '+t('catalogueDown'):t('catalogueUnavailable');render()}}
function stationMeta(s){const place=s.countrycode?flag(s.countrycode)+' '+countryName(s.countrycode):(s.country||t('internetRadio'));return place+(s.language?' • '+String(s.language).split(/[,;/]/).map(x=>languageName(x.trim(),'')).join(', '):'')}
function logoUrl(s){if(s.favicon&&/^https?:/i.test(s.favicon))return s.favicon;if(s.homepage){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(s.homepage).hostname)+'&sz=256'}catch(e){}}return ''}function list(){if(view==='fav')return stations.filter(s=>favorites.has(s.id));if(view==='recent')return recent.map(id=>stations.find(s=>s.id===id)).filter(Boolean);return stations}function render(){let a=list();listTitle.textContent=view==='fav'?t('favorites').replace(/^♡ /,''):view==='recent'?t('recent').replace(/^◷ /,''):t('popular');results.innerHTML=a.length?a.map((s,i)=>`<div class="station"><div class="station-logo">${logoUrl(s)?`<img loading="lazy" src="${esc(logoUrl(s))}" onerror="this.style.display='none';this.parentNode.dataset.fallback='${initials(s.name)}';this.parentNode.append(document.createTextNode('${initials(s.name)}'))">`:initials(s.name)}</div><div class="station-info"><b>${esc(s.name)}</b><small>${esc(stationMeta(s))}</small></div><button class="heart" onclick="toggleFav('${esc(s.id)}')">${favorites.has(s.id)?'♥':'♡'}</button><button class="play" onclick="playIndex(${i})">▶</button></div>`).join(''):'<div class="empty">'+esc(t('empty'))+'</div>';window.visible=a;historySection.classList.toggle('hidden',view!=='recent');renderHistory()}
function buildWave(){const w=document.querySelector('#wave');w.innerHTML=Array.from({length:28},(_,i)=>`<i style="--h:${14+((i*17)%32)}px"></i>`).join('')}
function setView(v,b){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('radioIdFavorites',JSON.stringify([...favorites]));updateFav();render()}function toggleCurrentFav(){if(current)toggleFav(current.id)}function updateFav(){heroFav.textContent=current&&favorites.has(current.id)?'♥':'♡'}
async function playIndex(i){let s=window.visible[i];if(!s)return;cancelRecognition();current=s;retryCount=0;manualStop=false;clearTimeout(retryTimer);recent=[s.id,...recent.filter(x=>x!==s.id)].slice(0,20);localStorage.setItem('radioIdRecent',JSON.stringify(recent));setHero(s);recognized.classList.add('hidden');if(!s.url){showFallback(s);return}if(location.protocol==='content:'&&s.url.startsWith('/api/')){notice('<b>Ta stacja wymaga wersji online Radio ID.</b>');setPlaying(false);return}player.src=playUrl(s);player.load();try{await player.play();if(manualStop){player.pause();setPlaying(false)}else setPlaying(true)}catch(e){scheduleRetry(s)}}function playUrl(s){if(!s?.url)return '';if(s.url.startsWith('/api/'))return s.url;if(/^https:\/\//i.test(s.url))return s.url;return '/api/stream?url='+encodeURIComponent(s.url)}function setHero(s){heroName.textContent=s.name;heroMeta.textContent=stationMeta(s);heroArt.innerHTML=logoUrl(s)?`<img src="${esc(logoUrl(s))}" onerror="this.parentNode.textContent='${initials(s.name)}'">`:initials(s.name);miniArt.innerHTML=heroArt.innerHTML;miniName.textContent=s.name;miniMeta.textContent=t('liveSmall');mini.classList.remove('hidden');updateFav()}
function setPlaying(on){mainPlay.textContent=miniPlay.textContent=on?'Ⅱ':'▶'}
player.onplaying=()=>{retryCount=0;setPlaying(true);toast.classList.add('hidden')};
player.onplay=()=>setPlaying(true);
player.onpause=()=>{if(manualStop)setPlaying(false)};
player.onwaiting=()=>{};player.onstalled=()=>{};
player.onerror=()=>{if(current&&!manualStop)scheduleRetry(current)};
player.onended=()=>{if(current&&!manualStop)scheduleRetry(current)};
async function scheduleRetry(s){if(!current||current.id!==s.id||manualStop)return;clearTimeout(retryTimer);if(retryCount>=2){showFallback(s);return}retryCount++;setPlaying(false);notice(`<b>${esc(s.name)}</b> — ${esc(t('retry'))} (${retryCount}/2)…`);retryTimer=setTimeout(async()=>{if(!current||current.id!==s.id||manualStop)return;const u=playUrl(s);player.src=u+(u.includes('?')?'&':'?')+'_r='+Date.now();player.load();try{await player.play()}catch(e){scheduleRetry(s)}},Math.min(1800*retryCount,5500))}
async function togglePlayer(){if(!current)return;if(player.paused){manualStop=false;retryCount=0;try{await player.play()}catch(e){scheduleRetry(current)}}else{manualStop=true;clearTimeout(retryTimer);player.pause();setPlaying(false)}}
const SLEEP_KEY='radioIdSleepDeadline';let sleepDeadline=Number(localStorage.getItem(SLEEP_KEY))||0;
function sleepRemaining(){return Math.max(0,Math.ceil((sleepDeadline-Date.now())/1000))}
function updateSleepTimer(){const seconds=sleepRemaining(),active=seconds>0;const label=active?Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'):'';sleepButton.textContent=active?'☾ '+t('sleepTimer').replace(/^☾ /,'')+' '+label:t('sleepTimer');sleepButton.classList.toggle('sleep-active',active);sleepState.textContent=active?t('sleepIn')+label+'.':t('sleepHint');sleepCancel.classList.toggle('hidden',!active);if(sleepDeadline&&!active){sleepDeadline=0;localStorage.removeItem(SLEEP_KEY);manualStop=true;clearTimeout(retryTimer);player.pause();player.removeAttribute('src');player.load();setPlaying(false);notice(esc(t('sleepEnded')))}}
function openSleepTimer(){sleepOverlay.classList.remove('hidden');updateSleepTimer();sleepOverlay.querySelector('.sleep-close').focus()}
function closeSleepTimer(){sleepOverlay.classList.add('hidden');sleepButton.focus()}
function setSleepTimer(minutes){if(!current){closeSleepTimer();notice(esc(t('stationFirst')));return}sleepDeadline=Date.now()+minutes*60000;localStorage.setItem(SLEEP_KEY,String(sleepDeadline));updateSleepTimer();closeSleepTimer();notice(esc(t('sleepSet')+minutes+' min'))}
function cancelSleepTimer(){sleepDeadline=0;localStorage.removeItem(SLEEP_KEY);updateSleepTimer();closeSleepTimer();notice(esc(t('sleepCancelled')))}
setInterval(updateSleepTimer,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateSleepTimer()});updateSleepTimer();
function notice(html){toast.innerHTML=html;toast.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.add('hidden'),5200)}
function showFallback(s){setPlaying(false);notice(`<b>${esc(s.name)}</b> — ${esc(t('streamError'))} ${s.homepage?`<a href="${esc(s.homepage)}" target="_blank" rel="noopener">${esc(t('playerLink'))}</a>`:''}`)}function openStation(){if(current?.homepage)window.open(current.homepage,'_blank')}async function shareStation(){if(!current)return;let data={title:current.name,text:t('liveSmall')+' '+current.name+' — Radio ID',url:current.homepage||location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(data.url);recognized.classList.remove('hidden');recognized.innerHTML='<b>'+esc(t('copied'))+'</b>'}}catch(e){}}
async function searchStations(){let term=document.querySelector('#q').value.trim();if(!term)return load();const run=++stationLoadRun;status.textContent=t('searching');const params=new URLSearchParams({hidebroken:'true',limit:'150',name:term,order:'clickcount',reverse:'true'});if(selectedCountry)params.set('countrycode',selectedCountry);if(selectedLanguage)params.set('language',selectedLanguage);try{const found=norm(await api('/stations/search?'+params));if(run!==stationLoadRun)return;stations=mergeStations(found).filter(s=>s.name.toLowerCase().includes(term.toLowerCase()));view='all';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));status.textContent=stations.length+' '+t('resultCount');render()}catch(e){if(run===stationLoadRun)status.textContent=t('searchError')}}function focusSearch(){searchBox.classList.add('open');q.focus();searchBox.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function recognize(){if(!current){recognized.classList.remove('hidden');recognized.innerHTML='<b>'+esc(t('stationFirst'))+'</b>';return}const run=++recognitionRun,button=document.querySelector('#recognizeButton');button.disabled=true;button.setAttribute('aria-busy','true');recognized.classList.remove('hidden');recognized.innerHTML='<b>'+esc(t('recognizing'))+'</b><p class="muted">'+esc(t('connect'))+'</p>';try{const response=NATIVE_BACKEND?await recognizeNatively(current.id,current.url,run):await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({station:current.id,url:current.url})});if(run!==recognitionRun)return;const x=await response.json().catch(()=>({ok:false,error:'invalid_server_response'}));if(!response.ok||!x.ok){const messages={audd_not_configured:t('auddMissing'),missing_or_invalid_stream:t('invalidStream'),audio_clip_too_small:t('clipSmall'),audd_timeout:t('auddTimeout')};throw new Error(messages[x.error]||x.message||('HTTP '+response.status+': '+(x.error||'błąd serwera')))}if(!x.found){recognized.innerHTML=`<b>${esc(x.message||t('notFound'))}</b>`;return}const links=[x.spotify?`<a href="${esc(x.spotify)}" target="_blank" rel="noopener">Spotify</a>`:'',x.apple_music?`<a href="${esc(x.apple_music)}" target="_blank" rel="noopener">Apple Music</a>`:'',x.song_link?`<a href="${esc(x.song_link)}" target="_blank" rel="noopener">${esc(t('more'))}</a>`:''].filter(Boolean).join(' · ');recognized.innerHTML=`<b>${esc(x.title)}</b><p>${esc(x.artist||t('unknownArtist'))}${x.album?' · '+esc(x.album):''}</p>${links?`<p>${links}</p>`:''}`;hist.unshift({title:x.title,artist:x.artist||'',date:new Date().toLocaleString('pl-PL')});localStorage.setItem('radioIdHistory',JSON.stringify(hist.slice(0,50)));renderHistory()}catch(error){if(run===recognitionRun&&error.message!=='recognition_cancelled')recognized.innerHTML=`<b>${esc(error.message||'Nie udało się rozpoznać utworu.')}</b>`}finally{if(run===recognitionRun){button.disabled=false;button.removeAttribute('aria-busy')}}}
function renderHistory(){history.innerHTML=hist.length?hist.map(x=>`<div class="history-row"><b>${esc(x.title)}</b><div class="muted">${esc(x.artist)} • ${esc(x.date)}</div></div>`).join(''):'<div class="empty">'+esc(t('historyEmpty'))+'</div>'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}buildWave();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');loadCountries();loadLanguages();load();renderHistory();refreshUI();
</script></body></html>
