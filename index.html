</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">◉</div><div><h1>Radio <span>ID</span></h1><p class="muted">Twoje ulubione radio w jednym miejscu</p></div></div><div class="top-actions"><button class="iconbtn" onclick="focusSearch()" aria-label="Szukaj">⌕</button><button class="iconbtn" aria-label="Tryb nocny">☾</button><button class="iconbtn" aria-label="Ustawienia">⚙</button></div></header><div class="search" id="searchBox"><input id="q" placeholder="Szukaj stacji, np. RMF, BBC, jazz"><button onclick="searchStations()">Szukaj</button></div><nav class="tabs"><button class="tab active" onclick="setView('all',this)">⌂&nbsp; Stacje</button><button class="tab" onclick="setView('fav',this)">♡&nbsp; Ulubione</button><button class="tab" onclick="setView('recent',this)">◷&nbsp; Ostatnio</button><button class="tab" onclick="focusSearch()">◉&nbsp; Odkryj</button></nav>
<section class="hero"><div class="hero-main"><div class="hero-head"><div class="art" id="heroArt">ID</div><div class="hero-copy"><span class="live">● NA ŻYWO</span><h2 id="heroName">Wybierz stację</h2><div id="heroMeta" class="muted">Radio internetowe</div></div></div><div class="wave" id="wave"></div></div><div class="player-row"><div class="now-playing"><b id="trackTitle">♫ Radio na żywo</b><small id="trackTime">Dotknij „Rozpoznaj utwór”, aby poznać tytuł</small></div><div class="controls"><button class="heart" id="heroFav" onclick="toggleCurrentFav()">♡</button><button class="mainplay" id="mainPlay" onclick="togglePlayer()">▶</button></div></div><div class="recognize"><button class="action" id="recognizeButton" onclick="recognize()">♫ Rozpoznaj utwór</button><button class="action" onclick="shareStation()">⌯ Udostępnij</button><button class="action" onclick="openStation()">↗ Strona stacji</button><button class="action" onclick="notice('Timer snu pojawi się w wersji aplikacji.')">☾ Timer snu</button></div><div id="recognized" class="result hidden" aria-live="polite"></div><audio id="player" playsinline></audio></section>
<div class="section-title"><h2 id="listTitle">Popularne stacje</h2><span id="status" class="status">Ładowanie…</span></div><section id="results"></section><section class="history hidden" id="historySection"><div class="section-title"><h2>Historia rozpoznanych</h2></div><div id="history"></div></section></main><div class="toast hidden" id="toast"></div><div class="mini hidden" id="mini"><div class="station-logo" id="miniArt">ID</div><div class="station-info"><b id="miniName">Radio ID</b><small id="miniMeta">Na żywo</small></div><button class="play" onclick="togglePlayer()" id="miniPlay">▶</button></div><nav class="bottom-nav" aria-label="Główna nawigacja"><button class="active" onclick="setView('all',document.querySelector('.tab'))"><span>⌂</span>Start</button><button onclick="setView('all',document.querySelector('.tab'))"><span>♫</span>Stacje</button><button onclick="setView('fav',document.querySelectorAll('.tab')[1])"><span>♡</span>Ulubione</button><button onclick="setView('recent',document.querySelectorAll('.tab')[2])"><span>◷</span>Ostatnio</button><button onclick="notice('Więcej opcji pojawi się w wersji aplikacji.')"><span>•••</span>Więcej</button></nav>
<style>html,body{max-width:100%;overflow-x:hidden}.app{width:100%;min-width:0;overflow:hidden}#results{width:100%;min-width:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.station{width:100%;min-width:0;max-width:100%;overflow:hidden}@media(max-width:700px){#results{grid-template-columns:minmax(0,1fr)}}</style>
<style>.logo svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px #8b22ff88)}@media(max-width:700px){.logo svg{width:42px;height:42px}}</style>
<script>
const status=document.querySelector('#status');
document.querySelector('.logo').innerHTML='<svg viewBox="0 0 64 64" role="img" aria-label="Radio ID"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><path d="M16 13C5 24 5 44 16 55M48 13c11 11 11 31 0 42M23 20c-7 7-7 21 0 28M41 20c7 7 7 21 0 28M28 27c-4 4-4 10 0 14M36 27c4 4 4 10 0 14"/><circle cx="32" cy="34" r="5"/><path d="M32 39v15"/></g></svg>';
const API='https://de1.api.radio-browser.info/json', player=document.querySelector('#player');let stations=[],view='all',current=null,retryCount=0,retryTimer=null,manualStop=false,recent=JSON.parse(localStorage.getItem('radioIdRecent')||'[]');let favorites=new Set(JSON.parse(localStorage.getItem('radioIdFavorites')||'[]'));const hist=JSON.parse(localStorage.getItem('radioIdHistory')||'[]');
const fixed=[{id:'prl',name:'Polskie Radio Londyn (PRL)',country:'United Kingdom',language:'polish',url:'https://stream.rcs.revma.com/prfmwmwy768uv',homepage:'https://prl24.co.uk/',favicon:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo_prl_new.jpg'},{id:'sami',name:'Sami Swoi Radio',country:'United Kingdom',language:'polish',url:'https://s2.radio.co/s0dc6b5c9b/listen',homepage:'https://www.samiswoiradio.co.uk/',favicon:'https://www.google.com/s2/favicons?domain=samiswoiradio.co.uk&sz=256'},{id:'fix',name:'Fix Radio',country:'United Kingdom',language:'english',url:'/api/stream/fix',homepage:'https://www.fixradio.co.uk/listen/player/',favicon:'https://www.google.com/s2/favicons?domain=fixradio.co.uk&sz=256'},{id:'zet',name:'Radio ZET',country:'Poland',language:'polish',url:'https://zt.cdn.eurozet.pl/zet-net.mp3',homepage:'https://www.radiozet.pl/',favicon:'https://www.google.com/s2/favicons?domain=radiozet.pl&sz=256'},{id:'zetkids',name:'Radio ZET Kids',country:'Poland',language:'polish',url:'https://zt.cdn.eurozet.pl/ZETKID.mp3',homepage:'https://www.radiozet.pl/',favicon:'https://www.google.com/s2/favicons?domain=radiozet.pl&sz=256'},{id:'zet2000',name:'Radio ZET - 2000',country:'Poland',language:'polish',url:'https://zt.cdn.eurozet.pl/ZET200.mp3',homepage:'https://www.radiozet.pl/',favicon:'https://www.google.com/s2/favicons?domain=radiozet.pl&sz=256'}];
async function api(p){let r=await fetch(API+p);if(!r.ok)throw 0;return r.json()}function nameKey(n){return String(n||'').toLowerCase().replace(/\bradio\b/g,'').replace(/[^a-z0-9ąćęłńóśźż]+/g,' ').trim()}function norm(a){let best=new Map;for(const s of a){if(!(s.url_resolved||s.url))continue;let o={id:s.stationuuid||s.url_resolved,name:s.name||'Bez nazwy',country:s.country||'',language:s.language||'',url:s.url_resolved||s.url,homepage:s.homepage||'',favicon:s.favicon||''},k=nameKey(o.name)||o.id,prev=best.get(k);if(!prev||(o.favicon&&!prev.favicon))best.set(k,o)}return [...best.values()]}
async function load(){try{let qs=['RMF FM','Radio ZET','Radio ESKA','TOK FM','BBC','Polskie Radio'].map(n=>api('/stations/search?hidebroken=true&limit=8&name='+encodeURIComponent(n)));qs.push(api('/stations/bycountrycodeexact/PL?hidebroken=true&limit=35&order=clickcount&reverse=true'));let x=await Promise.allSettled(qs),found=norm(x.filter(v=>v.status==='fulfilled').flatMap(v=>v.value));stations=[...fixed,...found.filter(s=>!fixed.some(f=>nameKey(s.name)===nameKey(f.name)))];status.textContent=stations.length+' stacji';render()}catch(e){stations=[...fixed];status.textContent='Tryb podstawowy';render()}}
function logoUrl(s){if(s.favicon&&/^https?:/i.test(s.favicon))return s.favicon;if(s.homepage){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(s.homepage).hostname)+'&sz=256'}catch(e){}}return ''}function list(){if(view==='fav')return stations.filter(s=>favorites.has(s.id));if(view==='recent')return recent.map(id=>stations.find(s=>s.id===id)).filter(Boolean);return stations}function render(){let a=list();listTitle.textContent=view==='fav'?'Ulubione':view==='recent'?'Ostatnio słuchane':'Popularne stacje';results.innerHTML=a.length?a.map((s,i)=>`<div class="station"><div class="station-logo">${logoUrl(s)?`<img loading="lazy" src="${esc(logoUrl(s))}" onerror="this.style.display='none';this.parentNode.dataset.fallback='${initials(s.name)}';this.parentNode.append(document.createTextNode('${initials(s.name)}'))">`:initials(s.name)}</div><div class="station-info"><b>${esc(s.name)}</b><small>${esc(s.country||'Radio internetowe')}${s.language?' • '+esc(s.language):''}</small></div><button class="heart" onclick="toggleFav('${esc(s.id)}')">${favorites.has(s.id)?'♥':'♡'}</button><button class="play" onclick="playIndex(${i})">▶</button></div>`).join(''):'<div class="empty">Brak stacji w tej sekcji.</div>';window.visible=a;historySection.classList.toggle('hidden',view!=='recent');renderHistory()}
function buildWave(){const w=document.querySelector('#wave');w.innerHTML=Array.from({length:28},(_,i)=>`<i style="--h:${14+((i*17)%32)}px"></i>`).join('')}
function setView(v,b){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('radioIdFavorites',JSON.stringify([...favorites]));updateFav();render()}function toggleCurrentFav(){if(current)toggleFav(current.id)}function updateFav(){heroFav.textContent=current&&favorites.has(current.id)?'♥':'♡'}
async function playIndex(i){let s=window.visible[i];if(!s)return;current=s;retryCount=0;manualStop=false;clearTimeout(retryTimer);recent=[s.id,...recent.filter(x=>x!==s.id)].slice(0,20);localStorage.setItem('radioIdRecent',JSON.stringify(recent));setHero(s);recognized.classList.add('hidden');if(!s.url){showFallback(s);return}if(location.protocol==='content:'&&s.url.startsWith('/api/')){notice('<b>Ta stacja wymaga wersji online Radio ID.</b>');setPlaying(false);return}player.src=playUrl(s);player.load();try{await player.play();setPlaying(true)}catch(e){scheduleRetry(s)}}function playUrl(s){if(!s?.url)return '';if(s.url.startsWith('/api/'))return s.url;if(/^https:\/\//i.test(s.url))return s.url;return '/api/stream?url='+encodeURIComponent(s.url)}function setHero(s){heroName.textContent=s.name;heroMeta.textContent=(s.country||'Radio internetowe')+(s.language?' • '+s.language:'');heroArt.innerHTML=logoUrl(s)?`<img src="${esc(logoUrl(s))}" onerror="this.parentNode.textContent='${initials(s.name)}'">`:initials(s.name);miniArt.innerHTML=heroArt.innerHTML;miniName.textContent=s.name;miniMeta.textContent='Na żywo';mini.classList.remove('hidden');updateFav()}
function setPlaying(on){mainPlay.textContent=miniPlay.textContent=on?'Ⅱ':'▶'}
player.onplaying=()=>{retryCount=0;setPlaying(true);toast.classList.add('hidden')};
player.onplay=()=>setPlaying(true);
player.onpause=()=>{if(manualStop)setPlaying(false)};
player.onwaiting=()=>{};player.onstalled=()=>{};
player.onerror=()=>{if(current&&!manualStop)scheduleRetry(current)};
player.onended=()=>{if(current&&!manualStop)scheduleRetry(current)};
async function scheduleRetry(s){if(!current||current.id!==s.id||manualStop)return;clearTimeout(retryTimer);if(retryCount>=2){showFallback(s);return}retryCount++;setPlaying(false);notice(`<b>${esc(s.name)}</b> — ponowne łączenie (${retryCount}/2)…`);retryTimer=setTimeout(async()=>{if(!current||current.id!==s.id||manualStop)return;const u=playUrl(s);player.src=u+(u.includes('?')?'&':'?')+'_r='+Date.now();player.load();try{await player.play()}catch(e){scheduleRetry(s)}},Math.min(1800*retryCount,5500))}
async function togglePlayer(){if(!current)return;if(player.paused){manualStop=false;retryCount=0;try{await player.play()}catch(e){scheduleRetry(current)}}else{manualStop=true;clearTimeout(retryTimer);player.pause();setPlaying(false)}}
function notice(html){toast.innerHTML=html;toast.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.add('hidden'),5200)}
function showFallback(s){setPlaying(false);notice(`<b>${esc(s.name)}</b> — nie udało się utrzymać połączenia ze streamem. ${s.homepage?`<a href="${esc(s.homepage)}" target="_blank" rel="noopener">Otwórz player stacji ↗</a>`:''}`)}function openStation(){if(current?.homepage)window.open(current.homepage,'_blank')}async function shareStation(){if(!current)return;let data={title:current.name,text:'Słucham '+current.name+' w Radio ID',url:current.homepage||location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(data.url);recognized.classList.remove('hidden');recognized.innerHTML='<b>Link skopiowany.</b>'}}catch(e){}}
async function searchStations(){let q=document.querySelector('#q').value.trim();if(!q)return load();status.textContent='Szukam…';try{let a=norm(await api('/stations/search?hidebroken=true&limit=60&name='+encodeURIComponent(q)));stations=[...fixed.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())),...a];view='all';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));status.textContent=stations.length+' wyników';render()}catch(e){status.textContent='Błąd wyszukiwania'}}function focusSearch(){searchBox.classList.add('open');q.focus();searchBox.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function recognize(){if(!current){recognized.classList.remove('hidden');recognized.innerHTML='<b>Najpierw włącz stację.</b>';return}const button=document.querySelector('#recognizeButton');button.disabled=true;button.setAttribute('aria-busy','true');recognized.classList.remove('hidden');recognized.innerHTML='<b>Rozpoznaję…</b><p class="muted">Pobieram krótki fragment transmisji.</p>';try{const response=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({station:current.id,url:current.url})});const x=await response.json().catch(()=>({ok:false,error:'invalid_server_response'}));if(!response.ok||!x.ok){const messages={audd_not_configured:'Rozpoznawanie AudD nie jest skonfigurowane na serwerze.',missing_or_invalid_stream:'Nie udało się odczytać adresu tej stacji.',audio_clip_too_small:'Fragment transmisji był zbyt krótki. Spróbuj ponownie.',audd_timeout:'AudD nie odpowiedziało na czas. Spróbuj ponownie.'};throw new Error(messages[x.error]||'Nie udało się rozpoznać utworu. Spróbuj ponownie.')}if(!x.found){recognized.innerHTML=`<b>${esc(x.message||'Nie rozpoznano utworu.')}</b>`;return}const links=[x.spotify?`<a href="${esc(x.spotify)}" target="_blank" rel="noopener">Spotify</a>`:'',x.apple_music?`<a href="${esc(x.apple_music)}" target="_blank" rel="noopener">Apple Music</a>`:'',x.song_link?`<a href="${esc(x.song_link)}" target="_blank" rel="noopener">Więcej</a>`:''].filter(Boolean).join(' · ');recognized.innerHTML=`<b>${esc(x.title)}</b><p>${esc(x.artist||'Nieznany wykonawca')}${x.album?' · '+esc(x.album):''}</p>${links?`<p>${links}</p>`:''}`;hist.unshift({title:x.title,artist:x.artist||'',date:new Date().toLocaleString('pl-PL')});localStorage.setItem('radioIdHistory',JSON.stringify(hist.slice(0,50)));renderHistory()}catch(error){recognized.innerHTML=`<b>${esc(error.message||'Nie udało się rozpoznać utworu.')}</b>`}finally{button.disabled=false;button.removeAttribute('aria-busy')}}
function renderHistory(){history.innerHTML=hist.length?hist.map(x=>`<div class="history-row"><b>${esc(x.title)}</b><div class="muted">${esc(x.artist)} • ${esc(x.date)}</div></div>`).join(''):'<div class="empty">Brak rozpoznanych utworów.</div>'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}buildWave();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');load();renderHistory();
</script></body></html>
