<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Radio ID"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Radio ID Mobile</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 45% -10%,#17234b 0,#07101f 42%,#040914 100%);color:#f8fafc;min-height:100vh}button,input{font:inherit}.app{max-width:900px;margin:auto;padding:22px 18px 160px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#8b5cf622;border:2px solid #a855f7;color:#c084fc;font-size:26px}.brand h1{margin:0;font-size:32px}.brand h1 span{color:#a855f7}.muted{color:#9aa9c5}.brand p{margin:2px 0 0}.iconbtn,.play,.heart{border:0;color:white;background:#101c33;border-radius:16px;cursor:pointer}.iconbtn{width:48px;height:48px;font-size:22px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-width:0;padding:15px 16px;border:1px solid #253452;border-radius:16px;background:#0c172a;color:white;outline:none}.search button{border:0;border-radius:16px;padding:0 18px;background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.tab{border:1px solid #223250;background:#0c172a;color:#dce6f7;padding:13px 8px;border-radius:16px;font-weight:750}.tab.active{background:linear-gradient(135deg,#6d28d9,#7c3aed);border-color:#8b5cf6}.hero{padding:15px;border:1px solid #293b63;border-radius:24px;background:radial-gradient(circle at 75% 5%,#6d28d922,transparent 32%),linear-gradient(135deg,#101d35f2,#081426f2);box-shadow:0 24px 70px #0008;margin:14px 0 20px;overflow:hidden}.hero-head{display:flex;gap:16px;align-items:center;position:relative}.art{width:82px;height:82px;flex:none;border-radius:22px;background:linear-gradient(145deg,#e2e8f0,#fff);display:grid;place-items:center;color:#7c3aed;font-weight:900;font-size:20px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}.hero h2{margin:0 0 4px;font-size:23px}.live{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#6d28d9;font-size:12px;font-weight:900}.wave{height:42px;display:flex;align-items:end;justify-content:center;gap:4px;margin:12px 0}.wave i{display:block;width:4px;border-radius:9px;background:linear-gradient(#c084fc,#7c3aed);height:var(--h);opacity:.9}.controls{display:flex;align-items:center;justify-content:center;gap:22px}.heart{width:52px;height:52px;font-size:28px}.mainplay{width:64px;height:64px;border:0;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff;font-size:30px;box-shadow:0 0 30px #7c3aed66}.recognize{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.action{padding:12px 8px;border:1px solid #243553;border-radius:16px;background:#0d1930;color:#fff;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 8px}.section-title h2{margin:0}.status{font-size:13px;color:#8fa0bd}.station{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:7px 0;min-height:68px;background:#0c172a;border:1px solid #182844;border-radius:20px}.station-logo{width:52px;height:52px;border-radius:15px;background:#f8fafc;color:#111827;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.station-logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}.station-info{min-width:0;flex:1}.station-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.station-info small{color:#91a0bb}.station .heart{width:42px;height:42px;background:transparent;font-size:25px}.station .play{width:44px;height:44px;background:#14223b;font-size:21px}.empty{padding:30px;text-align:center;color:#93a3be}.result{margin-top:14px;padding:15px;border-radius:18px;background:#0a1428;border:1px solid #273759}.history{margin-top:20px}.history-row{padding:11px 0;border-bottom:1px solid #1d2b45}.toast{position:fixed;left:50%;bottom:102px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));padding:12px 14px;border-radius:16px;background:#111d33f2;border:1px solid #334563;box-shadow:0 12px 40px #0009;z-index:30;font-size:14px}.mini{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(724px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:22px;background:#0b172beF;border:1px solid #2a3a5b;box-shadow:0 15px 50px #000b;backdrop-filter:blur(18px);z-index:20}.mini .station-logo{width:44px;height:44px;border-radius:12px}.mini .play{margin-left:auto;width:48px;height:48px;font-size:20px}.hidden{display:none!important}a{color:#c4b5fd}@media(min-width:700px){#results{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}}@media(max-width:560px){.app{padding:12px 12px 132px}.search{margin:14px 0}.hero{margin:10px 0 16px}.hero-head{gap:12px}.wave{height:38px}.controls{gap:18px}.section-title{margin:18px 2px 6px}.brand h1{font-size:27px}.brand p{font-size:13px}.logo{width:42px;height:42px}.hero{padding:16px}.art{width:72px;height:72px}.hero h2{font-size:21px}.tabs{gap:6px}.tab{font-size:13px}.recognize{grid-template-columns:1fr 1fr}.recognize .action:last-child{grid-column:1/-1}.station{padding:11px 9px}.station-logo{width:48px;height:48px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">◉</div><div><h1>Radio <span>ID</span></h1><p class="muted">Twoje radio w jednym miejscu</p></div></div><button class="iconbtn" onclick="focusSearch()">⌕</button></header><div class="search"><input id="q" placeholder="Szukaj stacji, np. RMF, BBC, jazz"><button onclick="searchStations()">Szukaj</button></div><nav class="tabs"><button class="tab active" onclick="setView('all',this)">Stacje</button><button class="tab" onclick="setView('fav',this)">♡ Ulubione</button><button class="tab" onclick="setView('recent',this)">◷ Ostatnio</button></nav>
<section class="hero"><div class="hero-head"><div class="art" id="heroArt">ID</div><div><h2 id="heroName">Wybierz stację</h2><div id="heroMeta" class="muted">Radio internetowe</div><span class="live">● NA ŻYWO</span></div></div><div class="wave" id="wave"></div><div class="controls"><button class="heart" id="heroFav" onclick="toggleCurrentFav()">♡</button><button class="mainplay" id="mainPlay" onclick="togglePlayer()">▶</button></div><div class="recognize"><button class="action" onclick="recognize()">♫ Rozpoznaj utwór</button><button class="action" onclick="shareStation()">⌯ Udostępnij</button><button class="action" onclick="openStation()">↗ Strona stacji</button></div><div id="recognized" class="result hidden"></div><audio id="player" playsinline></audio></section>
<div class="section-title"><h2 id="listTitle">Popularne stacje</h2><span id="status" class="status">Ładowanie…</span></div><section id="results"></section><section class="history hidden" id="historySection"><div class="section-title"><h2>Historia rozpoznanych</h2></div><div id="history"></div></section></main><div class="toast hidden" id="toast"></div><div class="mini hidden" id="mini"><div class="station-logo" id="miniArt">ID</div><div class="station-info"><b id="miniName">Radio ID</b><small id="miniMeta">Na żywo</small></div><button class="play" onclick="togglePlayer()" id="miniPlay">▶</button></div>
<script>
const API='https://de1.api.radio-browser.info/json', player=document.querySelector('#player');let stations=[],view='all',current=null,recent=JSON.parse(localStorage.getItem('radioIdRecent')||'[]');let favorites=new Set(JSON.parse(localStorage.getItem('radioIdFavorites')||'[]'));const hist=JSON.parse(localStorage.getItem('radioIdHistory')||'[]');
const fixed=[{id:'prl',name:'Polskie Radio Londyn (PRL)',country:'United Kingdom',language:'polish',url:'/api/stream/prl',homepage:'https://prl24.co.uk/',favicon:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Logo_prl_new.jpg'},{id:'sami',name:'Sami Swoi Radio',country:'United Kingdom',language:'polish',url:'/api/stream/sami',homepage:'https://www.samiswoiradio.co.uk/',favicon:'https://www.google.com/s2/favicons?domain=samiswoiradio.co.uk&sz=256'},{id:'fix',name:'Fix Radio',country:'United Kingdom',language:'english',url:'/api/stream/fix',homepage:'https://www.fixradio.co.uk/listen/player/',favicon:'https://www.google.com/s2/favicons?domain=fixradio.co.uk&sz=256'}];
async function api(p){let r=await fetch(API+p);if(!r.ok)throw 0;return r.json()}function nameKey(n){return String(n||'').toLowerCase().replace(/\bradio\b/g,'').replace(/[^a-z0-9ąćęłńóśźż]+/g,' ').trim()}function norm(a){let best=new Map;for(const s of a){if(!(s.url_resolved||s.url))continue;let o={id:s.stationuuid||s.url_resolved,name:s.name||'Bez nazwy',country:s.country||'',language:s.language||'',url:s.url_resolved||s.url,homepage:s.homepage||'',favicon:s.favicon||''},k=nameKey(o.name)||o.id,prev=best.get(k);if(!prev||(o.favicon&&!prev.favicon))best.set(k,o)}return [...best.values()]}
async function load(){try{let qs=['RMF FM','Radio ZET','Radio ESKA','TOK FM','BBC','Polskie Radio'].map(n=>api('/stations/search?hidebroken=true&limit=8&name='+encodeURIComponent(n)));qs.push(api('/stations/bycountrycodeexact/PL?hidebroken=true&limit=35&order=clickcount&reverse=true'));let x=await Promise.allSettled(qs),found=norm(x.filter(v=>v.status==='fulfilled').flatMap(v=>v.value));stations=[...fixed,...found.filter(s=>!fixed.some(f=>s.name.toLowerCase()===f.name.toLowerCase()))];status.textContent=stations.length+' stacji';render()}catch(e){stations=[...fixed];status.textContent='Tryb podstawowy';render()}}
function logoUrl(s){if(s.favicon&&/^https?:/i.test(s.favicon))return s.favicon;if(s.homepage){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(s.homepage).hostname)+'&sz=256'}catch(e){}}return ''}function list(){if(view==='fav')return stations.filter(s=>favorites.has(s.id));if(view==='recent')return recent.map(id=>stations.find(s=>s.id===id)).filter(Boolean);return stations}function render(){let a=list();listTitle.textContent=view==='fav'?'Ulubione':view==='recent'?'Ostatnio słuchane':'Popularne stacje';results.innerHTML=a.length?a.map((s,i)=>`<div class="station"><div class="station-logo">${logoUrl(s)?`<img loading="lazy" src="${esc(logoUrl(s))}" onerror="this.style.display='none';this.parentNode.dataset.fallback='${initials(s.name)}';this.parentNode.append(document.createTextNode('${initials(s.name)}'))">`:initials(s.name)}</div><div class="station-info"><b>${esc(s.name)}</b><small>${esc(s.country||'Radio internetowe')}${s.language?' • '+esc(s.language):''}</small></div><button class="heart" onclick="toggleFav('${esc(s.id)}')">${favorites.has(s.id)?'♥':'♡'}</button><button class="play" onclick="playIndex(${i})">▶</button></div>`).join(''):'<div class="empty">Brak stacji w tej sekcji.</div>';window.visible=a;historySection.classList.toggle('hidden',view!=='recent');renderHistory()}
function buildWave(){const w=document.querySelector('#wave');w.innerHTML=Array.from({length:28},(_,i)=>`<i style="--h:${14+((i*17)%32)}px"></i>`).join('')}
function setView(v,b){view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('radioIdFavorites',JSON.stringify([...favorites]));updateFav();render()}function toggleCurrentFav(){if(current)toggleFav(current.id)}function updateFav(){heroFav.textContent=current&&favorites.has(current.id)?'♥':'♡'}
async function playIndex(i){let s=window.visible[i];if(!s)return;current=s;recent=[s.id,...recent.filter(x=>x!==s.id)].slice(0,20);localStorage.setItem('radioIdRecent',JSON.stringify(recent));setHero(s);recognized.classList.add('hidden');if(!s.url){showFallback(s);return}if(location.protocol==='content:'&&s.url.startsWith('/api/')){notice('<b>Ta stacja wymaga uruchomienia Radio ID przez serwer.</b> Uruchom wersję online/HTTPS zamiast pliku content://.');setPlaying(false);return}player.src=s.url;try{await player.play();setPlaying(true)}catch(e){showFallback(s)}}function setHero(s){heroName.textContent=s.name;heroMeta.textContent=(s.country||'Radio internetowe')+(s.language?' • '+s.language:'');heroArt.innerHTML=logoUrl(s)?`<img src="${esc(logoUrl(s))}" onerror="this.parentNode.textContent='${initials(s.name)}'">`:initials(s.name);miniArt.innerHTML=heroArt.innerHTML;miniName.textContent=s.name;miniMeta.textContent='Na żywo';mini.classList.remove('hidden');updateFav()}
function setPlaying(on){mainPlay.textContent=miniPlay.textContent=on?'Ⅱ':'▶'}player.onplay=()=>setPlaying(true);player.onpause=()=>setPlaying(false);player.onerror=()=>current&&showFallback(current);async function togglePlayer(){if(!current)return;if(player.paused){try{await player.play()}catch(e){showFallback(current)}}else player.pause()}function notice(html){toast.innerHTML=html;toast.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.add('hidden'),5200)}function showFallback(s){setPlaying(false);notice(`<b>${esc(s.name)}</b> nie może być odtworzone z lokalnego pliku. ${s.homepage?`<a href="${esc(s.homepage)}" target="_blank" rel="noopener">Otwórz player stacji ↗</a>`:''}`)}function openStation(){if(current?.homepage)window.open(current.homepage,'_blank')}async function shareStation(){if(!current)return;let data={title:current.name,text:'Słucham '+current.name+' w Radio ID',url:current.homepage||location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(data.url);recognized.classList.remove('hidden');recognized.innerHTML='<b>Link skopiowany.</b>'}}catch(e){}}
async function searchStations(){let q=document.querySelector('#q').value.trim();if(!q)return load();status.textContent='Szukam…';try{let a=norm(await api('/stations/search?hidebroken=true&limit=60&name='+encodeURIComponent(q)));stations=[...fixed.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())),...a];view='all';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));status.textContent=stations.length+' wyników';render()}catch(e){status.textContent='Błąd wyszukiwania'}}function focusSearch(){q.focus()}
async function recognize(){if(!current){recognized.classList.remove('hidden');recognized.innerHTML='<b>Najpierw włącz stację.</b>';return}recognized.classList.remove('hidden');recognized.innerHTML='<b>Rozpoznaję…</b>';try{let r=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({station:current.name,streamUrl:current.url})});if(!r.ok)throw 0;let x=await r.json();if(!x.title)throw 0;recognized.innerHTML=`<b>${esc(x.title)}</b><p>${esc(x.artist||'Nieznany wykonawca')}</p>`;hist.unshift({title:x.title,artist:x.artist||'',date:new Date().toLocaleString('pl-PL')});localStorage.setItem('radioIdHistory',JSON.stringify(hist.slice(0,50)));renderHistory()}catch(e){recognized.innerHTML='<b>Serwer rozpoznawania nie jest jeszcze skonfigurowany.</b>'}}
function renderHistory(){history.innerHTML=hist.length?hist.map(x=>`<div class="history-row"><b>${esc(x.title)}</b><div class="muted">${esc(x.artist)} • ${esc(x.date)}</div></div>`).join(''):'<div class="empty">Brak rozpoznanych utworów.</div>'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}buildWave();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');load();renderHistory();
</script></body></html>
